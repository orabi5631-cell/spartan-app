name: Build SPARTAN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Copy native plugin into the generated Android project
        run: |
          mkdir -p android/app/src/main/java/com/spartan/cards
          cp android-plugin/VodafonePurchasePlugin.kt android/app/src/main/java/com/spartan/cards/VodafonePurchasePlugin.kt
          cp android-plugin/MainActivity.java android/app/src/main/java/com/spartan/cards/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cp android-plugin/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

      - name: Allow cleartext traffic in the manifest
        run: |
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spartan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
