name: Build SPARTAN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Copy native plugin into the generated Android project
        run: |
          mkdir -p android/app/src/main/java/com/spartan/cards
          cp android-plugin/VodafonePurchasePlugin.java android/app/src/main/java/com/spartan/cards/VodafonePurchasePlugin.java
          cp android-plugin/MainActivity.java android/app/src/main/java/com/spartan/cards/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cp android-plugin/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

      - name: Allow cleartext traffic in the manifest
        run: |
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml

      - name: Configure fixed debug signing (so new builds install as updates)
        run: |
          base64 -d android-plugin/spartan-debug.keystore.base64 > android-plugin/spartan-debug.keystore
          ls -la android-plugin/spartan-debug.keystore
          keytool -list -v -keystore android-plugin/spartan-debug.keystore -storepass spartan123 -alias spartankey | head -5
          python3 - << 'PYEOF'
          import sys
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()
          signing_block = '''    signingConfigs {
        debug {
            storeFile file("../../android-plugin/spartan-debug.keystore")
            storePassword "spartan123"
            keyAlias "spartankey"
            keyPassword "spartan123"
        }
    }
'''
          if "spartan-debug.keystore" in content:
              print("signingConfigs already present, skipping insert")
          else:
              marker = "android {"
              if marker not in content:
                  print("ERROR: could not find 'android {' in build.gradle")
                  sys.exit(1)
              content = content.replace(marker, marker + "\n" + signing_block, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("signingConfigs block inserted")
          PYEOF
          echo "----- relevant part of build.gradle -----"
          grep -A 8 "signingConfigs" android/app/build.gradle || (echo "ERROR: signingConfigs missing after patch" && exit 1)

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spartan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
